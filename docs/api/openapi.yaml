        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/admin/outbox/{id}/replay:
    post:
      tags: [Admin]
      summary: Replay a outbox record
      description: >-
        Inserts a new event (new id and event id) referencing the original, which is never modified. Only one unfinished replay per event. Requires a reason; audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
