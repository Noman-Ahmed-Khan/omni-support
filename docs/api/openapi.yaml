              $ref: '#/components/schemas/AIRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
  /api/v1/customers:
    get:
      tags:
        - Customers
      summary: List customers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortByCustomers'
        - $ref: '#/components/parameters/SortOrder'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: assignedAgentId
          in: query
          schema:
            type: string
            format: uuid
        - name: riskLabel
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerResponse'
    post:
      tags:
        - Customers
      summary: Create a new customer record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseWrapper'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/customers/{id}:
    get:
      tags:
        - Customers
      summary: Get a customer record
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags:
        - Customers
      summary: Update a customer record
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Customers
      summary: Delete a customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted successfully
  /api/v1/customers/{id}/timeline:
    get:
      tags:
        - Customers
      summary: Get customer timeline activity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogResponse'
  /api/v1/customers/{id}/risk-score:
    post:
      tags:
        - Customers
      summary: Trigger customer risk score calculation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '202':
          $ref: '#/components/responses/MessageResponse'
  /api/v1/analytics/trends:
    get:
      tags:
        - Analytics
      summary: Ticket trend metrics for the current tenant
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
          description: Lookback period in days (default 30)
      responses:
        '200':
          description: Trends metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTrendsResponse'
  /api/v1/analytics/platform:
    get:
      tags:
        - Analytics
      summary: Platform metrics for administrators
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetricsResponse'
  /api/v1/dashboards:
    get:
      tags:
        - Analytics
      summary: Tenant dashboard metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/reports/generate:
    post:
      tags:
        - Reports
      summary: Queue a tenant report
      description: Generates a filtered CSV or JSON export or JSON summary asynchronously.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
      responses:
        '202':
          description: Report job queued
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List the current user's report jobs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, EXPIRED] }
      responses:
        '200': { description: Report jobs }
  /api/v1/reports/{id}:
    get:
      tags: [Reports]
      summary: Get the current user's report job
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Report job }
  /api/v1/reports/{id}/cancel:
    post:
      tags: [Reports]
      summary: Cancel a pending or running report job
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Report cancelled }
  /api/v1/reports/{id}/download-url:
    get:
      tags: [Reports]
      summary: Get a short-lived download URL for a completed report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Signed URL valid for 600 seconds; the report file itself expires after 24 hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      url: { type: string }
                      expiresInSeconds: { type: integer }
        '409': { description: Report is not completed or has expired }
  /api/v1/search:
    get:
      tags:
        - Search
      summary: Global tenant search
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query text
        - name: types
          in: query
          schema:
            type: string
          description: "Comma-separated search types: ticket, customer, comment"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsResponse'
  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: List current user notifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationResponse'
  /api/v1/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
  /api/v1/notifications/mark-all-read:
    patch:
      tags:
        - Notifications
      summary: Mark all current notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
  /api/v1/webhooks/whatsapp/inbound:
    post:
      tags:
        - Webhooks
      summary: Receive inbound WhatsApp webhook events
      description: Validates Twilio signature and queues inbound messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload forwarded by the WhatsApp provider
      responses:
        '200':
          description: Acknowledged webhook
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/webhooks/whatsapp/status:
    post:
      tags:
        - Webhooks
      summary: Receive WhatsApp status update webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider status payload
      responses:
        '200':
          description: Status update acknowledged
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size for pagination
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort order for lists
    SortByUsers:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, updatedAt, fullName, role, status, email]
      description: Field used to sort users
    SortByTickets:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, updatedAt, priority, status, ticketNumber]
      description: Field used to sort tickets
    SortByCustomers:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, updatedAt, fullName, riskScore, lastActivityAt]
      description: Field used to sort customers
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User identifier
    TenantId:
      $ref: '#/components/parameters/UserId'
    TicketId:
      $ref: '#/components/parameters/UserId'
    CustomerId:
      $ref: '#/components/parameters/UserId'
    CommentId:
      $ref: '#/components/parameters/UserId'
    AttachmentId:
      $ref: '#/components/parameters/UserId'
    NotificationId:
      $ref: '#/components/parameters/UserId'
  schemas:
    HealthLivenessResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    HealthReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        checks:
          type: object
          additionalProperties:
            type: string
      required: [status, checks]
    HealthFullResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        checks:
          type: object
          additionalProperties:
            type: string
        websocket:
          type: object
          properties:
            connectedClients:
              type: integer
      required: [status, checks, websocket]
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthRefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
    VerifyEmailRequest:
      type: object
      required: [token, userId]
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid
    UserBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [PLATFORM_ADMIN, TENANT_MANAGER, AGENT, CUSTOMER]
        status:
          type: string
        tenantId:
          type: string
          format: uuid
        avatarUrl:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, firstName, lastName, fullName, role, status, tenantId, createdAt, updatedAt]
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserBase'
    UserResponseWrapper:
      $ref: '#/components/schemas/UserResponse'
    UpdateUserProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          format: uri
        phone:
          type: string
        timezone:
          type: string
        locale:
          type: string
    ChangeUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [PLATFORM_ADMIN, TENANT_MANAGER, AGENT, CUSTOMER]
    TenantBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
          nullable: true
        plan:
          type: string
          enum: [starter, professional, enterprise]
        maxAgents:
          type: integer
        maxCustomers:
          type: integer
        status:
          type: string
        settings:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, plan, maxAgents, maxCustomers, status, createdAt, updatedAt]
    TenantResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantBase'
    TenantResponseWrapper:
      $ref: '#/components/schemas/TenantResponse'
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
        plan:
          type: string
          enum: [starter, professional, enterprise]
        maxAgents:
          type: integer
        maxCustomers:
          type: integer
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        plan:
          type: string
          enum: [starter, professional, enterprise]
        maxAgents:
          type: integer
        maxCustomers:
          type: integer
        maxTicketsPerDay:
          type: integer
        settings:
          type: object
          additionalProperties: true
      additionalProperties: false
    SuspendTenantRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    TicketBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ticketNumber:
          type: string
        customerId:
          type: string
          format: uuid
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
        createdById:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, PENDING_CUSTOMER, RESOLVED, CLOSED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        category:
          type: string
          enum: [BILLING, TECHNICAL, ACCOUNT, REFUND, SHIPPING, GENERAL, OTHER]
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [web, email, whatsapp, api]
        isEscalated:
          type: boolean
        escalatedAt:
          type: string
          format: date-time
          nullable: true
        escalatedReason:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        firstResponseAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        slaBreached:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, ticketNumber, customerId, createdById, title, description, status, priority, category, tags, source, isEscalated, slaBreached, createdAt, updatedAt]
    TicketResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TicketBase'
    TicketResponseWrapper:
      $ref: '#/components/schemas/TicketResponse'
    CreateTicketRequest:
      type: object
      required: [title, description]
      properties:
        customerId:
          type: string
          format: uuid
          description: Required for staff; ignored for customers, whose linked record is used.
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          default: MEDIUM
        category:
          type: string
          enum: [BILLING, TECHNICAL, ACCOUNT, REFUND, SHIPPING, GENERAL, OTHER]
          default: GENERAL
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [web, email, whatsapp, api]
          default: web
        assignedAgentId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        category:
          type: string
          enum: [BILLING, TECHNICAL, ACCOUNT, REFUND, SHIPPING, GENERAL, OTHER]
        tags:
          type: array
          items:
            type: string
        dueAt:
          type: string
          format: date-time
    AssignTicketRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
          format: uuid
    ChangeTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, PENDING_CUSTOMER, RESOLVED, CLOSED]
    EscalateTicketRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
    AddCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        type:
          type: string
          enum: [PUBLIC, INTERNAL]
          default: PUBLIC
    CommentResponseWrapper:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        timestamp:
          type: string
          format: date-time
    AttachmentBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [PENDING, SCANNED, CLEAN, INFECTED, REJECTED]
          description: PENDING until an antivirus scanner has checked the file
    AttachmentResponseWrapper:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AttachmentBase'
        timestamp:
          type: string
          format: date-time
    AttachmentDownloadResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
        timestamp:
          type: string
          format: date-time
    UploadAttachmentRequest:
      type: object
      required: [filename, mimeType, base64Content]
      properties:
        filename:
          type: string
        mimeType:
          type: string
        base64Content:
          type: string
        ticketId:
          type: string
          format: uuid
        commentId:
          type: string
          format: uuid
    AIRequest:
      type: object
      properties:
        content:
          type: string
    AIResultsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: string
        notes:
          type: string
        assignedAgentId:
          type: string
          format: uuid
        externalId:
          type: string
    UpdateCustomerRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
        company:
          type: string
        notes:
          type: string
        assignedAgentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
    CustomerBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        riskScore:
          type: number
          nullable: true
        riskLabel:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          nullable: true
        externalId:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, fullName, email, status, createdAt, updatedAt]
    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CustomerBase'
    CustomerResponseWrapper:
      $ref: '#/components/schemas/CustomerResponse'
    ActivityLogBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          type: string
          nullable: true
        eventType:
          type: string
        description:
          type: string
        oldValue:
          type: object
          additionalProperties: true
          nullable: true
        newValue:
          type: object
          additionalProperties: true
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
