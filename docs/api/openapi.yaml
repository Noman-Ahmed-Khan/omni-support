    PlatformMetricsResponse:
      type: object
      additionalProperties: true
    DashboardResponse:
      type: object
      additionalProperties: true
    GenerateReportRequest:
      type: object
      required: [subject, kind]
      properties:
        subject:
          type: string
          enum: [tickets, customers]
        kind:
          type: string
          enum: [summary, export]
        format:
          type: string
          enum: [json, csv]
        filters:
          type: object
          properties:
            status: { type: string }
            dateFrom: { type: string, format: date-time }
            dateTo: { type: string, format: date-time }
    PermissionCatalogEntry:
      type: object
      properties:
        key: { type: string, example: 'tickets:assign' }
        defaults: { type: array, items: { type: string, enum: [PLATFORM_ADMIN, TENANT_MANAGER, AGENT, CUSTOMER] } }
        boundary: { type: array, items: { type: string, enum: [PLATFORM_ADMIN, TENANT_MANAGER, AGENT, CUSTOMER] } }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        description: { type: string, nullable: true }
        isSystem: { type: boolean }
        permissions: { type: array, items: { type: string } }
        memberCount: { type: integer }
    CreateRoleRequest:
      type: object
      required: [name, displayName, permissions]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]+$', minLength: 2, maxLength: 50 }
        displayName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, items: { type: string } }
    UpdateRoleRequest:
      type: object
      properties:
        displayName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, items: { type: string } }
    WhatsAppChannelConfig:
      type: object
      required: [phoneNumber]
      additionalProperties: false
      properties:
        phoneNumber: { type: string, description: E.164 business number; unique across organizations }
        displayName: { type: string, maxLength: 100 }
    EmailChannelConfig:
      type: object
      required: [fromName]
      additionalProperties: false
      properties:
        fromName: { type: string, maxLength: 100, description: Sender name used with the shared sender address }
        replyTo: { type: string, format: email }
    ChannelConfig:
      oneOf:
        - $ref: '#/components/schemas/WhatsAppChannelConfig'
        - $ref: '#/components/schemas/EmailChannelConfig'
    Channel:
      type: object
      properties:
        provider: { type: string, enum: [whatsapp, email] }
        isEnabled: { type: boolean }
        config: { type: object }
        hasSigningSecret: { type: boolean }
        secretRotatedAt: { type: string, format: date-time, nullable: true }
        lastTest:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [SUCCEEDED, FAILED] }
            checkedAt: { type: string, format: date-time }
            message: { type: string }
        sharedProviderConfigured: { type: boolean }
        updatedAt: { type: string, format: date-time }
    InterventionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 1000 }
    Intervention:
      type: object
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string, enum: [outbox, webhook, settings] }
        targetId: { type: string, nullable: true }
        action: { type: string, enum: [RETRY, REPLAY, CANCEL, CONFIGURE, PURGE] }
        reason: { type: string }
        actorId: { type: string, format: uuid }
        resultId: { type: string, nullable: true, description: Id of the record a replay created }
        outcome: { type: string, enum: [ACCEPTED, SUCCEEDED, FAILED] }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OperationalSettings:
      type: object
      properties:
        outboxPaused: { type: boolean }
        retryMaxAttempts: { type: integer, minimum: 1, maximum: 20 }
        outboxRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        webhookRetentionDays: { type: integer, minimum: 1, maximum: 365 }
    OperationalSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/OperationalSettings'
        - $ref: '#/components/schemas/InterventionRequest'
    SearchResultsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer
        timestamp:
          type: string
          format: date-time
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message:
              type: string
        timestamp:
          type: string
          format: date-time
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          oneOf:
            - type: object
            - type: array
        meta:
          type: object
          nullable: true
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    UnauthorizedError:
      description: Authorization required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflict due to duplicate or invalid state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    BadRequestError:
      description: Bad request payload or missing information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
