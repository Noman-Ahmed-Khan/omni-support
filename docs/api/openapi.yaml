openapi: 3.0.3
info:
  title: OmniSupport API
  description: API documentation for the OmniSupport customer support backend.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Auth
    description: Authentication, session, and OAuth routes
  - name: Users
    description: User profile and admin user management
  - name: Tenants
    description: Tenant administration
  - name: Tickets
    description: Ticket lifecycle and ticket-related actions
  - name: Customers
    description: Customer management and profile data
  - name: Comments
    description: Ticket comment management
  - name: Attachments
    description: File upload and download
  - name: AI
    description: AI-powered ticket analysis and suggestions
  - name: Analytics
    description: Analytics and dashboard data
  - name: Reports
    description: Report generation and export jobs
  - name: Search
    description: Global search across tenants
  - name: Notifications
    description: User notification management
  - name: Webhooks
    description: Incoming webhook receivers
  - name: Roles
    description: Permission catalog, tenant roles and role memberships
  - name: Integrations
    description: Tenant WhatsApp and email channel configuration
  - name: Admin
    description: Audit logs and platform-admin operations
paths:
  /health:
    get:
      tags:
        - Health
      summary: Full health snapshot
      description: Returns application readiness and internal system checks.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFullResponse'
        '503':
          description: Service is not healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFullResponse'
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Returns a lightweight liveness response.
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLivenessResponse'
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Returns readiness status for external dependencies.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Returns application metrics in Prometheus text format.
      responses:
        '200':
          description: Metrics text
          content:
            text/plain:
              schema:
                type: string
  /api/v1/invitations:
    get:
      tags: [Auth]
      summary: List this organization's invitations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invitation metadata without tokens }
    post:
      tags: [Auth]
      summary: Invite a customer or agent to this organization
      description: Tenant managers may invite an agent or a customer linked to an existing customer record. The invitation token is emailed and is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [CUSTOMER, AGENT] }
                customerId: { type: string, format: uuid, description: Required for customer invitations }
      responses:
        '201': { description: Invitation created; returns its id and expiry }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept an emailed invitation
      description: >-
        Token possession verifies the invited email address. Name and password are required
        when creating a new account. An existing tenantless account is linked only when its
        owner is signed in (Bearer token optional on this route) or gives its current
        password; an unverified existing account must choose a new password, and its previous
        sessions and social logins are revoked. Tokens are single use and expire after 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                password: { type: string, format: password }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '204': { description: Invitation accepted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: The invitation belongs to a different or unproven account }
        '409': { description: Account or organization cannot accept, or staff limit reached }
  /api/v1/invitations/platform:
    post:
      tags: [Auth]
      summary: Platform administrator invites a tenant manager or agent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, email, role]
              properties:
                tenantId: { type: string, format: uuid }
                email: { type: string, format: email }
                role: { type: string, enum: [TENANT_MANAGER, AGENT] }
      responses:
        '201': { description: Invitation created }
  /api/v1/invitations/{id}/resend:
    post:
      tags: [Auth]
      summary: Replace and resend an active invitation token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitation resent }
  /api/v1/invitations/{id}:
    delete:
      tags: [Auth]
      summary: Revoke an active invitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitation revoked }
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate and issue JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token and issue a new access token
      description: Uses the refresh token from cookie or request body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset a user password using a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/verify-email:
    post:
      tags:
        - Auth
      summary: Verify a user's email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/google:
    get:
      tags:
        - Auth
      summary: Redirect to Google OAuth authorization
      responses:
        '302':
          description: Redirects to Google sign-in
  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Handle Google OAuth callback
      responses:
        '302':
          description: Redirects to frontend after successful OAuth login
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current refresh token and clear session cookie
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Return current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseWrapper'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get profile for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - Users
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/users:
    get:
      tags:
        - Users
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortByUsers'
        - $ref: '#/components/parameters/SortOrder'
        - name: role
          in: query
          schema:
            type: string
          description: Filter by one or more roles
        - name: status
          in: query
          schema:
            type: string
          description: Filter by user status
        - name: search
          in: query
          schema:
            type: string
          description: Search text for users
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users/{id}/role:
    put:
      tags:
        - Users
      summary: Change a user's role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserRoleRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable an agent and revoke refresh sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Agent disabled }
  /api/v1/users/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a disabled agent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Agent reactivated }
  /api/v1/users/{id}/remove:
    post:
      tags: [Users]
      summary: Remove an agent while retaining historical attribution
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                replacementAgentId: { type: string, format: uuid, description: Omit to unassign active work }
      responses:
        '204': { description: Agent removed and active work transferred or unassigned }
  /api/v1/users/me/permissions:
    get:
      tags: [Users]
      summary: Effective permissions of the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /api/v1/users/{id}/permissions:
    get:
      tags: [Users]
      summary: Account class, tenant roles and effective permissions of a user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: Effective permissions }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/roles/permissions:
    get:
      tags: [Roles]
      summary: Permission catalog with class defaults and boundaries
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionCatalogEntry' }
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: System roles and this organization's tenant roles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Roles]
      summary: Create a tenant role
      description: >-
        Grants must be tenant permissions the caller holds; platform permissions are never grantable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201': { description: Role created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/roles/{id}:
    get:
      tags: [Roles]
      summary: Get a role
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Role }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Roles]
      summary: Update a tenant role
      description: >-
        System roles are read-only. New grants must stay within every current member's account class boundary.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200': { description: Role updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Roles]
      summary: Delete a tenant role and its memberships
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Role deleted }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/roles/{id}/members:
    get:
      tags: [Roles]
      summary: Members of a role (for system roles, users of that account class)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Members }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/roles/{id}/members/{userId}:
    put:
      tags: [Roles]
      summary: Grant a tenant role to a user
      description: >-
        Rejected when the role grants permissions outside the user's account class boundary, or when changing one's own roles.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Role granted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Roles]
      summary: Revoke a tenant role from a user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Role revoked }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/integrations:
    get:
      tags: [Integrations]
      summary: List this organization's channels (redacted)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/integrations/{provider}:
    get:
      tags: [Integrations]
      summary: Get a channel (redacted)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '200': { description: Channel }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Integrations]
      summary: Create or change a channel identity
      description: >-
        Provider credentials are shared deployment configuration. A changed channel is disabled until its configuration passes a connection test. Unknown fields are rejected.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfig'
      responses:
        '200': { description: Channel saved (disabled) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Integrations]
      summary: Delete a channel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '204': { description: Channel deleted }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/integrations/{provider}/test:
    post:
      tags: [Integrations]
      summary: Run a connection test of the current configuration
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '200': { description: Test result (SUCCEEDED or FAILED) }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/integrations/{provider}/enable:
    post:
      tags: [Integrations]
      summary: Enable a channel after a passing test
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '200': { description: Channel enabled }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/v1/integrations/{provider}/disable:
    post:
      tags: [Integrations]
      summary: Disable a channel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '200': { description: Channel disabled }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/integrations/{provider}/rotate-secret:
    post:
      tags: [Integrations]
      summary: Rotate the channel signing secret
      description: >-
        The new secret is returned once in this response (Cache-Control no-store) and stored encrypted; read APIs only report hasSigningSecret.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [whatsapp, email] } }
      responses:
        '200': { description: New secret and rotation time }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      summary: Audit log metadata
      description: >-
        Tenant users see only their organization. Requires audit:read.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: resource, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: tenantId, in: query, description: Platform administrators only, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated audit entries }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/audit/{id}:
    get:
      tags: [Admin]
      summary: One audit entry with secret-like values redacted
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Audit entry }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/v1/admin/internal-health:
    get:
      tags: [Admin]
      summary: Counts for internal token, sequence, snapshot, report, role, webhook and outbox tables
      description: >-
        Platform administrators only. Returns counts and redacted provider status; never token values or record contents. Audited.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Health snapshot }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/providers:
    get:
      tags: [Admin]
      summary: Redacted status of shared storage, email, WhatsApp, Google OAuth and AI providers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: check, in: query, description: 'true runs live storage and SMTP checks', schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: Provider status }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/admin/integrations:
    get:
      tags: [Admin]
      summary: Integration records across organizations (redacted)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: provider, in: query, schema: { type: string } }
      responses:
