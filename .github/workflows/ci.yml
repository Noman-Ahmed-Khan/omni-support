name: CI Pipeline

on:
  push:
    branches: [main, dev, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # Type Check
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run TypeScript compiler check
        run: npm run typecheck

      - name: Type check tests, scripts and seeds
        run: npm run typecheck:all

      - name: Check for unreachable source files
        run: npm run check:dead-code

      - name: Check .env.example is in sync
        run: npm run check:env

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_long
          ENCRYPTION_KEY: test_encryption_key_minimum_32_characters
          OPENAI_API_KEY: sk-test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: test@example.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: test
          SMTP_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          WHATSAPP_PROVIDER: twilio
          WHATSAPP_ACCOUNT_SID: test_sid
          WHATSAPP_AUTH_TOKEN: test_token
          WHATSAPP_FROM_NUMBER: '+14155238886'
          WHATSAPP_WEBHOOK_URL: http://localhost:3000/api/v1/webhooks/whatsapp
          STORAGE_PROVIDER: memory
          FRONTEND_URL: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
          LOG_LEVEL: error

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/

  # Integration & E2E Tests
  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnisupport
          POSTGRES_PASSWORD: omnisupport_secret
          POSTGRES_DB: omnisupport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_test

      - name: Run database migrations
        run: npm run db:migrate:prod
        env:
          DATABASE_URL: postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_long
          ENCRYPTION_KEY: test_encryption_key_minimum_32_characters
          OPENAI_API_KEY: sk-test
          EMAIL_FROM: test@test.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: test
          SMTP_PASSWORD: test
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PATH: /tmp/uploads-test
          LOCAL_STORAGE_SECRET: test_storage_secret_minimum_32_characters
          WHATSAPP_ACCOUNT_SID: test
          WHATSAPP_AUTH_TOKEN: test
          WHATSAPP_FROM_NUMBER: '+14155238886'
          WHATSAPP_WEBHOOK_URL: http://localhost:3000/api/v1/webhooks/whatsapp
          FRONTEND_URL: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
          LOG_LEVEL: error

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters_long
          ENCRYPTION_KEY: test_encryption_key_minimum_32_characters
          OPENAI_API_KEY: sk-test
          EMAIL_FROM: test@test.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: test
          SMTP_PASSWORD: test
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PATH: /tmp/uploads-test
          LOCAL_STORAGE_SECRET: test_storage_secret_minimum_32_characters
          WHATSAPP_ACCOUNT_SID: test
          WHATSAPP_AUTH_TOKEN: test
          WHATSAPP_FROM_NUMBER: '+14155238886'
          WHATSAPP_WEBHOOK_URL: http://localhost:3000/api/v1/webhooks/whatsapp
          FRONTEND_URL: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
          LOG_LEVEL: error

  # Build
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Container smoke test: both images must build, boot, report healthy and shut down cleanly
  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnisupport
          POSTGRES_PASSWORD: omnisupport_secret
          POSTGRES_DB: omnisupport_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:prod

      - name: Build images
        run: |
          docker build -f docker/app/Dockerfile -t omnisupport-app:smoke .
          docker build -f docker/worker/Dockerfile -t omnisupport-worker:smoke .

      - name: Boot app and worker
        run: |
          cat > smoke.env <<'ENV'
          NODE_ENV=production
          DATABASE_URL=postgresql://omnisupport:omnisupport_secret@localhost:5432/omnisupport_smoke
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_ACCESS_SECRET=smoke_access_secret_minimum_32_characters
          JWT_REFRESH_SECRET=smoke_refresh_secret_minimum_32_characters
          ENCRYPTION_KEY=smoke_encryption_key_minimum_32_characters
          LOCAL_STORAGE_SECRET=smoke_storage_secret_value
          FRONTEND_URL=http://localhost:3001
          CORS_ORIGINS=http://localhost:3001
          EMAIL_PROVIDER=smtp
          EMAIL_FROM=smoke@example.com
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=smoke
          SMTP_PASSWORD=smoke
          OPENAI_API_KEY=sk-smoke
          ENABLE_API_DOCS=true
          RUN_WORKERS=false
          ENV
          docker run -d --name app --network host --env-file smoke.env omnisupport-app:smoke
          docker run -d --name worker --network host --env-file smoke.env omnisupport-worker:smoke

      - name: Check health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health/live && break
            sleep 2
          done
          curl -fsS http://localhost:3000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/docs/
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' worker)" = "true"

      - name: Check graceful shutdown
        run: |
          docker stop -t 30 app worker
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = "0"

      - name: Container logs
        if: failure()
        run: |
          docker logs app || true
          docker logs worker || true

  # Docker Build
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, container-smoke]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            NODE_ENV=production

      - name: Extract worker image metadata
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}-worker
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker/Dockerfile
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # Pinned to a commit: a tag or branch could be repointed to other code.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: NPM audit
        run: npm audit --audit-level=high